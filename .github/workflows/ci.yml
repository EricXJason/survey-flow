name: SurveyFlow CI/CD Pipeline

on:
  push:
    branches:
      - master
      - development
      - dev
      - feature
  pull_request:
    branches:
      - master
      - development
      - dev

jobs:
  backend-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean test

      - name: Verify Backend Packaging (JAR)
        run: |
          cd backend
          ./mvnw package -DskipTests

  frontend-ci:
    name: Frontend Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Frontend for Production (Cloudflare Pages Target)
        run: |
          cd frontend
          npm run build
