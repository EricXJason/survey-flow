name: Render Keep Alive (防止冷啟動)

# ==============================================================================
# 檔案名稱: keep-alive.yml
# 責任描述: 每 14 分鐘定期向 Render 後端健康檢查端點發送 HTTP 請求，防止免費容器休眠
# 聯動關係:
#   - 上游觸發: GitHub Actions 排程器 (每 14 分鐘) / 網頁手動觸發 (workflow_dispatch)
#   - 下游目標: Render 後端服務 https://survey-flow-9gt6.onrender.com/actuator/health
# ==============================================================================

on:
  schedule:
    # 每 14 分鐘定時觸發一次 (Render 於無流量 15 分鐘後休眠)
    - cron: '*/14 * * * *'
  workflow_dispatch: # 支援在 GitHub 介面手動點擊 Run workflow

jobs:
  keep-alive:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send Health Probe to Render
        run: |
          echo "正在發送健康檢查探針至 Render 後端..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://survey-flow-9gt6.onrender.com/actuator/health)
          echo "Render 健康檢查回應代碼: ${RESPONSE}"
          if [ "${RESPONSE}" = "200" ]; then
            echo "✅ Render 後端在線常駐中，容器已成功刷新保活。"
          else
            echo "⚠️ Render 正在冷啟動或重啟中 (回應碼: ${RESPONSE})，探針已成功喚醒容器。"
          fi
