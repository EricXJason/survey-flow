<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none">
  <defs>
    <linearGradient id="sf-grad" x1="0" y1="0" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sf-check" x1="14" y1="24" x2="28" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="sf-shadow" x="0" y="2" width="42" height="42" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e40af" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 38x38 Precision Mark -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#sf-grad)" filter="url(#sf-shadow)"/>
    <!-- Subtle inset sheet -->
    <rect x="7" y="7" width="24" height="24" rx="6" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Survey items -->
    <rect x="10.5" y="11.5" width="10" height="2" rx="1" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="10.5" y="15.5" width="14" height="1.8" rx="0.9" fill="#ffffff" fill-opacity="0.65"/>
    <!-- Dynamic Checkmark -->
    <path d="M12 23.5L16.5 28L26 16.5" stroke="url(#sf-check)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(48, 28)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">Survey</text>
    <text x="70" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#2563eb" letter-spacing="-0.03em">Flow</text>
    <circle cx="114" cy="-3" r="2.5" fill="#06b6d4"/>
  </g>
</svg>
