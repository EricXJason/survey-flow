<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 純黑底色背景 (直角極簡，全黑白視覺) -->
  <rect width="64" height="64" rx="6" fill="#000000"/>
  
  <!-- 純白問卷幾何結構線條 -->
  <line x1="12" y1="18" x2="52" y2="18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="28" x2="38" y2="28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="38" x2="44" y2="38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- 純黑白核取圓鈕徽記 (高對比白底黑勾) -->
  <circle cx="44" cy="42" r="9" fill="#ffffff"/>
  <path d="M40 42l3 3L49 38" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
