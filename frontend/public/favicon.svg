<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sf-wave" x1="12" y1="20" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sf-check" x1="18" y1="36" x2="48" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="sf-shadow" x="0" y="2" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sf-bg)" filter="url(#sf-shadow)"/>

  <!-- Survey Sheet / Card Accent -->
  <rect x="14" y="14" width="36" height="36" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Survey Form Lines -->
  <rect x="20" y="20" width="16" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="20" y="26" width="24" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Flow Wave Path -->
  <path d="M16 42C22 36 28 46 36 40C40 37 44 38 48 35" stroke="url(#sf-wave)" stroke-width="3" stroke-linecap="round"/>

  <!-- Dynamic Checkmark -->
  <path d="M22 37L29 44L44 26" stroke="url(#sf-check)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
