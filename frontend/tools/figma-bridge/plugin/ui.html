<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #030712;
      color: #f8fafc;
      font-size: 13px;
      user-select: none;
    }
    .status-card {
      background: #0b0f19;
      border: 1px solid #1e293b;
      padding: 12px 16px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }
    .dot.connected {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }
    .text {
      flex: 1;
      font-weight: 500;
    }
    .tip {
      margin-top: 12px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="status-card">
    <div id="dot" class="dot"></div>
    <div id="status" class="text">正在連線至 Antigravity MCP...</div>
  </div>
  <div class="tip">
    ⚡ <b>保持此視窗常駐</b>：AI Agent 將能隨時自動讀寫畫布，實現零手動、全自動雙向閉環。
  </div>

  <script>
    let ws = null;
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status');

    function connect() {
      try {
        ws = new WebSocket('ws://localhost:8765');

        ws.onopen = () => {
          dot.className = 'dot connected';
          statusText.innerText = '🟢 已連線至 Antigravity AI';
          statusText.style.color = '#00f0ff';
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            // 轉發給 Figma code.js
            parent.postMessage({ pluginMessage: data }, '*');
          } catch (e) {
            console.error('解析 MCP 訊息失敗', e);
          }
        };

        ws.onclose = () => {
          dot.className = 'dot';
          statusText.innerText = '🔴 連線中斷，正在自動重試...';
          statusText.style.color = '#ef4444';
          setTimeout(connect, 2000);
        };

        ws.onerror = () => {
          ws.close();
        };
      } catch (err) {
        setTimeout(connect, 2000);
      }
    }

    // 接收來自 Figma code.js 的執行結果並回傳給 WebSocket
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    };

    connect();
  </script>
</body>
</html>
