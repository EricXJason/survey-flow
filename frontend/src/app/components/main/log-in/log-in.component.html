<!--
  ============================================================================
  檔案名稱: log-in.component.html
  所屬模組: Presentation Layer / Login View
  責任描述: 會員登入視圖 (Member Login Portal)
            以極致純粹黑白中性、直角細緻 1px 建築線條呈現專業高質感表單，
            去 AI 模板化，移除多餘彩色照片與浮誇分欄。
  聯動關係:
    - 上游依賴: log-in.component.ts, ReactiveFormsModule
    - 下游消費: 透過 Angular Router 渲染為 '/log-in'
  ============================================================================
-->
<main class="page-auth" aria-labelledby="login-heading">
  <div class="auth-card">
    <header class="auth-header">
      <div class="auth-badge-wrap">
        <span class="auth-badge">會員中心</span>
      </div>
      <h1 id="login-heading" class="auth-title">會員登入</h1>
      <p class="auth-subtitle">歡迎回到 SurveyFlow，請輸入您的帳號密碼</p>
    </header>

    <form [formGroup]="formBuilderGroup" (ngSubmit)="checkLogInData()" novalidate class="auth-form">
      <!-- 帳號輸入欄位 -->
      <div class="form-group">
        <label for="login-username">使用者帳號</label>
        <div class="input-with-icon">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            id="login-username"
            type="text"
            formControlName="username"
            placeholder="請輸入 6 至 12 碼英數字帳號"
            autocomplete="username"
            [attr.aria-invalid]="formBuilderGroup.get('username')?.invalid && formBuilderGroup.get('username')?.touched"
            aria-describedby="username-error"
          />
        </div>
        @if (
          formBuilderGroup.get("username")?.invalid &&
          formBuilderGroup.get("username")?.touched
        ) {
          <span id="username-error" class="field-error" role="alert">
            請輸入 6 至 12 碼有效英數字帳號
          </span>
        }
      </div>

      <!-- 密碼輸入欄位 -->
      <div class="form-group">
        <div class="form-label-row">
          <label for="login-password">登入密碼</label>
          <button type="button" class="btn-link font-sm" (click)="goToForgetPasswordPage()">
            忘記密碼？
          </button>
        </div>
        <div class="input-with-icon">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            id="login-password"
            type="password"
            formControlName="password"
            placeholder="請輸入登入密碼"
            autocomplete="current-password"
            [attr.aria-invalid]="formBuilderGroup.get('password')?.invalid && formBuilderGroup.get('password')?.touched"
            aria-describedby="password-error"
          />
        </div>
        @if (
          formBuilderGroup.get("password")?.invalid &&
          formBuilderGroup.get("password")?.touched
        ) {
          <span id="password-error" class="field-error" role="alert">
            密碼須為 8 至 16 碼，且須同時包含英文大小寫、數字及特殊符號
          </span>
        }
      </div>

      <!-- 登入送出按鈕 -->
      <button type="submit" class="btn btn-primary btn-block btn-login-submit">
        <span>登入帳號</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
        </svg>
      </button>

      <div class="card-bottom-nav">
        <span>還沒有帳號嗎？</span>
        <button type="button" class="btn-link font-bold" (click)="goToRegisterAccountPage()">
          立即免費註冊
        </button>
      </div>
    </form>
  </div>
</main>
