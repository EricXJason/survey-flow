<div class="page-auth">
  <div class="form-card auth-card">
    <header class="auth-header">
      <span class="auth-badge">密碼安全</span>
      <h1 class="auth-title">忘記密碼</h1>
      <p class="auth-subtitle">請輸入您的註冊帳號與電子信箱以接收重設連結</p>
    </header>

    <form [formGroup]="formBuilderGroup" (ngSubmit)="checkForgotPasswordData()" novalidate>
      <div class="form-group">
        <label for="fp-username">使用者帳號</label>
        <input
          id="fp-username"
          type="text"
          formControlName="username"
          maxlength="12"
          placeholder="請輸入 6 至 12 碼使用者帳號"
          autocomplete="username"
          [attr.aria-invalid]="formBuilderGroup.get('username')?.invalid && formBuilderGroup.get('username')?.touched"
          aria-describedby="fp-username-err"
        />
        @if (
          formBuilderGroup.get("username")?.invalid &&
          formBuilderGroup.get("username")?.touched
        ) {
          <span id="fp-username-err" class="field-error" role="alert">
            請輸入 6 至 12 碼有效英數字帳號
          </span>
        }
      </div>

      <div class="form-group">
        <label for="fp-email">電子信箱</label>
        <input
          id="fp-email"
          type="email"
          formControlName="email"
          placeholder="例如：user@example.com"
          autocomplete="email"
          [attr.aria-invalid]="formBuilderGroup.get('email')?.invalid && formBuilderGroup.get('email')?.touched"
          aria-describedby="fp-email-err"
        />
        @if (
          formBuilderGroup.get("email")?.invalid &&
          formBuilderGroup.get("email")?.touched
        ) {
          <span id="fp-email-err" class="field-error" role="alert">
            請輸入格式正確的電子信箱
          </span>
        }
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn btn-primary btn-block">
          送出重設申請
        </button>
        <button type="button" class="btn btn-ghost btn-block" (click)="goToLogInPage()">
          返回登入頁面
        </button>
      </div>
    </form>
  </div>
</div>
