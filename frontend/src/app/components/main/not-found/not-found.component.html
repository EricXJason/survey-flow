<!--
  ============================================================================
  檔案名稱: not-found.component.html
  所屬模組: Presentation Layer / Not Found View
  責任描述: 404 找不到頁面視圖 (404 Not Found Portal)
            以簡約黑白中性、直角細緻線條呈現友善導航
  聯動關係:
    - 上游依賴: not-found.component.ts, RouterModule
    - 下游消費: 透過 Angular Router 渲染為 404 頁面
  ============================================================================
-->
<main class="page-not-found" aria-labelledby="not-found-heading">
  <div class="container not-found-container">
    <div class="not-found-card">
      
      <!-- 標誌性 404 徽記與向量指南針圖示 -->
      <div class="not-found-badge-wrap" aria-hidden="true">
        <div class="not-found-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="not-found-svg">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
        </div>
        <span class="code-badge">404 找不到頁面</span>
      </div>

      <h1 id="not-found-heading" class="not-found-title">
        您所尋找的頁面不存在
      </h1>

      <p class="not-found-desc">
        該頁面可能已被移除、重新命名，或是輸入了不正確的網址路徑。請檢查您的網址是否輸入無誤，或透過下方按鈕導航回系統主要專區。
      </p>

      <!-- 快捷返回動作列 -->
      <div class="not-found-actions">
        <a routerLink="/home" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>返回首頁</span>
        </a>

        <a routerLink="/lobby" class="btn btn-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M8 10h8M8 14h5"/>
          </svg>
          <span>前往問卷大廳</span>
        </a>
      </div>

    </div>
  </div>
</main>
