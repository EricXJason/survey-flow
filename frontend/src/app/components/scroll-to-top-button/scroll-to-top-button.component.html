<button
  type="button"
  class="scroll-to-top-btn"
  [class.visible]="isVisible()"
  (click)="onScrollToTop()"
  aria-label="回到網頁頂端"
  title="回到網頁頂端"
>
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</button>
