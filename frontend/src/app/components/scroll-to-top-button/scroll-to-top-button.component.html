<!--
  ============================================================================
  檔案名稱: scroll-to-top-button.component.html
  所屬模組: 頁面導航置頂微組件模組 (Scroll Interaction Module)
  責任描述: scroll-to-top-button.component.ts 之畫面範本 — 負責固定於視窗右下角的置頂按鈕渲染與點擊互動，調用 UtilityService 實現視窗平滑捲動回頂。
  聯動關係:
    - 上游依賴: scroll-to-top-button.component.ts (狀態、事件處理與表單模型)
    - 下游消費: 瀏覽器 DOM 呈現
  ============================================================================
-->
<button
  type="button"
  class="scroll-to-top-btn"
  [class.visible]="isVisible()"
  (click)="onScrollToTop()"
  aria-label="回到網頁頂端"
  title="回到網頁頂端"
>
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</button>
