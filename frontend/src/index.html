<!doctype html>
<html lang="zh-Hant-TW" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <base href="/" />

    <!-- 1. 頁面主要識別與 SEO 標題 -->
    <title>SurveyFlow — 現代化專業線上問卷調研與數據收集平台</title>
    <meta
      name="description"
      content="SurveyFlow 為專業人士打造的現代化線上問卷調研平台。支援是非、單選、多選與 10 點評分量表，提供直覺的題目拖曳排序、條件邏輯跳題與背景欄位自訂，廣泛適用於顧客滿意度、產品體驗、市場調研與學術研究等多元領域。"
    />
    <meta
      name="keywords"
      content="線上問卷, 問卷平台, 問卷設計, 調查研究, 滿意度調查, NPS, 評分量表, 條件跳題, 題目排序, SurveyFlow, 問卷分析, 表單設計, 意見回饋, 學術調查, 產品研究"
    />

    <!-- 2. 搜尋引擎檢索指令 -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta
      name="bingbot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- 3. 標準網址設定 -->
    <link rel="canonical" href="https://surveyflow.tw/" />

    <!-- 4. 作者與品牌版權資訊 -->
    <meta name="author" content="SurveyFlow Team" />
    <meta name="publisher" content="SurveyFlow" />
    <meta name="application-name" content="SurveyFlow" />
    <meta name="copyright" content="SurveyFlow. All rights reserved." />

    <!-- 5. 地理區域與語言標記 -->
    <meta name="geo.region" content="TW" />
    <meta name="geo.placename" content="Taiwan" />
    <meta http-equiv="content-language" content="zh-TW" />

    <!-- 6. 視窗與行動裝置顯示設定 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />

    <!-- 7. PWA 與主題配色設定 -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SurveyFlow" />

    <!-- 8. 網站圖示設定 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- 9. Open Graph 社群分享協定 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SurveyFlow" />
    <meta property="og:locale" content="zh_TW" />
    <meta
      property="og:title"
      content="SurveyFlow — 現代化專業線上問卷調研與數據收集平台"
    />
    <meta
      property="og:description"
      content="現代化線上問卷調研系統。支援是非、單選、多選與 10 點評分量表，具備拖曳排序與條件邏輯跳題，適用於顧客滿意度、產品體驗與各類調研場景，受訪者免註冊即可直接作答。"
    />
    <meta property="og:url" content="https://surveyflow.tw/" />
    <meta property="og:image" content="https://surveyflow.tw/logo.svg" />
    <meta property="og:image:secure_url" content="https://surveyflow.tw/logo.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta
      property="og:image:alt"
      content="SurveyFlow 品牌向量標識"
    />

    <!-- 10. Twitter 卡片設定 -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="SurveyFlow — 現代化專業線上問卷調研與數據收集平台"
    />
    <meta
      name="twitter:description"
      content="支援多元題目類型、直覺表單拖曳設計與條件邏輯跳題，廣泛適用於各專業調研情境。"
    />
    <meta name="twitter:image" content="https://surveyflow.tw/logo.svg" />
    <meta
      name="twitter:image:alt"
      content="SurveyFlow 品牌標誌"
    />

    <!-- 11. 效能最佳化：DNS 預先解析與預先連線 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- 12. 字型載入 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;850&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- 13. 結構化資料：應用程式 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SurveyFlow",
        "url": "https://surveyflow.tw",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All modern web browsers",
        "description": "專業線上問卷調研與數據收集平台，支援是非題、單選題、多選題、10 點評分量表、題目拖曳排序與條件邏輯跳題設計，適用於多元調研情境。",
        "inLanguage": "zh-TW",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "TWD"
        },
        "featureList": [
          "多元題型配置（是非題、單選題、多選題、10點評分量表）",
          "直覺式表單題目拖曳排序與自訂說明",
          "條件關聯邏輯跳題與動態題目展開",
          "背景資料欄位彈性自訂配置",
          "12 大官方問卷主題範疇與多元場景適用",
          "受訪者免註冊直接參與填答"
        ]
      }
    </script>

    <!-- 14. 結構化資料：組織資訊 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SurveyFlow",
        "url": "https://surveyflow.tw",
        "logo": "https://surveyflow.tw/logo.svg",
        "description": "現代化線上問卷調研平台，為發起者與受訪者提供嚴謹流暢的意見蒐集工具。"
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
