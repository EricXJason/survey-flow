# ============================================================================
# 檔案名稱: application.properties
# 所屬模組: SurveyFlow 後端服務設定
# 責任描述: Spring Boot 4.1.1 核心設定檔 (Properties 格式)，涵蓋 MySQL、JPA、安全與 Actuator
# 架構分層: Configuration Layer
# ============================================================================

# 伺服器基本設定
server.port=8080
server.servlet.context-path=/

# 應用程式名稱
spring.application.name=survey-flow-backend

# MySQL 8.x 資料來源設定 (支援環境變數覆寫，預設本機連線)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/survey_flow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 連線池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA 與 Hibernate 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL 初始化 DDL 腳本載入
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT 安全認證配置
jwt.secret=${JWT_SECRET:SurveyFlowSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Actuator 監控配置 (AWS 部署健康檢查使用)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# 日誌級別
logging.level.com.surveyflow=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
