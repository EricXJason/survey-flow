# ==============================================================================
# 檔案名稱: application.properties
# 所屬模組: SurveyFlow 後端組態中心
# 責任描述: Spring Boot 核心系統屬性設定檔。採模組化區塊化架構，各區塊於頂部以條列式
#           完整說明所有組態參數之工程用途與業務邊界，落實 OCP 原則與環境變數覆寫機制。
# ==============================================================================

# ------------------------------------------------------------------------------
# 區塊 1: 網路伺服器與應用程式環境 (Server & Application Context)
# 參數條列說明:
#   - server.port: 嵌入式 Tomcat 監聽之 HTTP 通訊埠 (預設 8080)
#   - server.servlet.context-path: 全域 Web API 根路徑前綴 (預設 /)
#   - spring.application.name: Spring 應用程式識別名稱
# ------------------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/
spring.application.name=survey-flow-backend

# ------------------------------------------------------------------------------
# 區塊 1.1: 圖片與高容量載荷傳輸上限 (Payload & Multipart Capacity - 50MB)
# 參數條列說明:
#   - server.tomcat.max-http-form-post-size: Tomcat HTTP POST 請求體最大容量 (50MB)
#   - server.tomcat.max-swallow-size: Tomcat 請求吞吐超時上限 (50MB)
#   - spring.servlet.multipart.max-file-size: 單一檔案上傳上限 (50MB)
#   - spring.servlet.multipart.max-request-size: 單次請求整體上傳上限 (50MB)
#   - spring.jackson.parser.max-string-len: Jackson 解析長字串 (Base64 DataURL) 上限 (50MB)
# ------------------------------------------------------------------------------
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.jackson.parser.max-string-len=50000000

# ------------------------------------------------------------------------------
# 區塊 2: MySQL 8.x 資料庫連線與 HikariCP 連線池 (Database & HikariCP Pool)
# 參數條列說明:
#   - spring.datasource.url: JDBC 連線網址，鎖定 utf8mb4 編碼、臺北時區與公鑰檢索授權
#   - spring.datasource.username: 資料庫連線使用者帳號
#   - spring.datasource.password: 資料庫連線使用者密碼
#   - spring.datasource.driver-class-name: MySQL 8.x 官方 JDBC 驅動程式類別
#   - spring.datasource.hikari.maximum-pool-size: 連線池最大活躍連線數
#   - spring.datasource.hikari.minimum-idle: 連線池常駐最小閒置連線數
#   - spring.datasource.hikari.idle-timeout: 閒置連線釋放超時上限 (毫秒，預設 5 分鐘)
#   - spring.datasource.hikari.connection-timeout: 取得資料庫連線之等待超時上限 (毫秒，預設 20 秒)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/survey_flow?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}

# ------------------------------------------------------------------------------
# 區塊 3: JPA / Hibernate ORM 與 SQL 腳本初始化 (JPA & Schema Initialization)
# 參數條列說明:
#   - spring.jpa.hibernate.ddl-auto: DDL 自動同步模式 (update: 自動依 Entity 校驗補齊表結構)
#   - spring.jpa.show-sql: 是否於控制台輸出 Hibernate 產生的 SQL 語句
#   - spring.jpa.open-in-view: 關閉 Open-Session-in-View 模式，嚴格落實交易隔離與防止連線外洩
#   - spring.jpa.properties.hibernate.format_sql: 格式化日誌輸出之 SQL 語法提升可讀性
#   - spring.jpa.properties.hibernate.dialect: 指定 Hibernate 使用 MySQL 8 方言轉換器
#   - spring.sql.init.mode: 資料庫初始化模式 (never: 避免覆寫真實持久化資料)
#   - spring.sql.init.schema-locations: DDL 結構腳本路徑
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql

# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# 區塊 4: JWT 安全驗證與零信任雙權杖效期控管 (Zero-Trust Dual-Token Architecture)
# 參數條列說明:
#   - jwt.secret: HMAC-SHA256 對稱密碼雜湊密鑰 (長度需 >= 256 bits)
#   - jwt.access-token-expiration-ms: 短效 Access Token 存活毫秒數 (預設 900,000 ms = 15 分鐘)
#   - jwt.refresh-token-expiration-ms: 長效 Refresh Token 存活毫秒數 (預設 604,800,000 ms = 7 天)
#   - jwt.expiration-ms: 向下相容別名 (預設 900,000 ms)
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:SurveyFlowSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ------------------------------------------------------------------------------
# 區塊 5: CORS 跨來源資源共用設定 (CORS Policy - OCP Externalized)
# 參數條列說明:
#   - app.cors.allowed-origins: 允許跨域請求之前端來源列表 (逗號分隔)
#   - app.cors.allowed-methods: 允許之 HTTP 方法
#   - app.cors.allowed-headers: 允許之 HTTP 請求標頭
#   - app.cors.max-age-seconds: 預檢請求 (Preflight) 快取秒數
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,Accept}
app.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

# ------------------------------------------------------------------------------
# 區塊 6: Argon2id 密碼雜湊安全參數 (Argon2id Hash Specs - OCP Externalized)
# 參數條列說明:
#   - app.security.argon2.salt-length: 隨機鹽值位元組長度 (16 bytes = 128 bits)
#   - app.security.argon2.hash-length: 輸出雜湊值位元組長度 (32 bytes = 256 bits)
#   - app.security.argon2.parallelism: 平行執行線程數 (1)
#   - app.security.argon2.memory: 記憶體開銷 (4096 KB = 4 MB)
#   - app.security.argon2.iterations: 迭代運算次數 (3)
# ------------------------------------------------------------------------------
app.security.argon2.salt-length=${ARGON2_SALT_LENGTH:16}
app.security.argon2.hash-length=${ARGON2_HASH_LENGTH:32}
app.security.argon2.parallelism=${ARGON2_PARALLELISM:1}
app.security.argon2.memory=${ARGON2_MEMORY:4096}
app.security.argon2.iterations=${ARGON2_ITERATIONS:3}

# ------------------------------------------------------------------------------
# 區塊 7: 全域日誌輸出層級配置 (Logging Level Configurations)
# 參數條列說明:
#   - logging.level.com.surveyflow: 專案業務核心程式碼之日誌級別 (DEBUG)
#   - logging.level.org.springframework.security: Spring Security 認證授權過濾器日誌級別 (INFO)
#   - logging.level.org.hibernate.SQL: Hibernate 底層執行 SQL 語句日誌級別 (DEBUG)
# ------------------------------------------------------------------------------
logging.level.com.surveyflow=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG


# ------------------------------------------------------------------------------
# 區塊 9: SMTP 電子郵件發送服務 (Spring Mail & Gmail SMTP)
# 參數條列說明:
#   - spring.mail.host: SMTP 伺服器主機 (預設 smtp.gmail.com)
#   - spring.mail.port: SMTP 通訊埠 (TLS 587)
#   - spring.mail.username: 發信 Gmail 地址 (外部化環境變數)
#   - spring.mail.password: Google 16 碼應用程式密碼 (外部化環境變數)
#   - app.mail.from: 寄件人顯示信箱
#   - app.mail.sender-name: 寄件人外顯名稱
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@surveyflow.tw}}
app.mail.sender-name=SurveyFlow \u7dda\u4e0a\u554f\u5377\u5718\u968a
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# ------------------------------------------------------------------------------
# 區塊 9.1: 雲端 HTTP 郵件 REST API (走 HTTPS Port 443 穿透 Render 免費方案防火牆)
# 參數條列說明:
#   - app.mail.brevo-api-key: Brevo (原 Sendinblue) API 金鑰 (每日 300 封免費額度，無需自訂網域)
#   - app.mail.resend-api-key: Resend API 金鑰 (每月 3,000 封免費額度)
#   - app.mail.provider: 指定郵件服務商 (AUTO: 自動優先 Brevo -> Resend -> SMTP, BREVO, RESEND, SMTP)
# ------------------------------------------------------------------------------
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.provider=${MAIL_PROVIDER:AUTO}

# ------------------------------------------------------------------------------
# 區塊 10: Actuator 健康檢查與保活探針端點配置 (Actuator Health Probe)
# 參數條列說明:
#   - management.endpoints.web.exposure.include: 對外暴露之 Actuator 端點清單 (僅 health)
#   - management.endpoint.health.show-details: 健康檢查詳細資訊可見範圍 (never: 不對外洩漏元件狀態)
#   - management.health.db.enabled: 是否納入資料庫健康檢核 (關閉以避免 DB 暫時離線導致 /actuator/health 回傳 503)
#   - management.health.mail.enabled: 是否納入郵件伺服器健康檢核 (關閉以避免 SMTP 超時導致探針失敗)
# [Why]: Render 免費容器依賴 /actuator/health 回傳 200 判斷存活，若 DB/Mail 暫時不穩導致 503，
#        會觸發 Render 健康檢查失敗 → 重啟容器 → 無限循環冷啟動。故僅檢查 JVM 本身是否存活即可。
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.mail.enabled=false

