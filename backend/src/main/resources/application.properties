# ============================================================================
# 檔案名稱: application.properties
# 所屬模組: SurveyFlow 後端服務設定
# 責任描述: Spring Boot 核心屬性設定檔，每項配置皆具備繁體中文詳細說明
# 架構分層: Configuration Layer
# ============================================================================

# 後端 Web 服務監聽之 HTTP 端口號 (預設為 8080)
server.port=8080

# 後端 Web 應用程式上下文根路徑 (預設為根目錄 /)
server.servlet.context-path=/

# Spring 應用程式識別名稱
spring.application.name=survey-flow-backend

# MySQL 8.x 資料庫 JDBC 連線位址 (預設連線本機 3306 端口 survey_flow 資料庫，採用 UTF-8 編碼與臺北時區)
spring.datasource.url=jdbc:mysql://localhost:3306/survey_flow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true

# MySQL 資料庫登入使用者帳號 (預設為 root)
spring.datasource.username=root

# 【⚠️ 請在此處填入您的 MySQL 密碼】若無密碼則留空，若有設密碼請在此行等號右側填寫 (例如: spring.datasource.password=123456)
spring.datasource.password=root1234

# MySQL 8.x 官方 JDBC 驅動程式類別完整路徑
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 連線池最大活動連線數
spring.datasource.hikari.maximum-pool-size=10

# HikariCP 連線池最小閒置連線數
spring.datasource.hikari.minimum-idle=5

# HikariCP 連線最大閒置時間 (毫秒，預設 5 分鐘)
spring.datasource.hikari.idle-timeout=300000

# HikariCP 等待取得資料庫連線之超時上限 (毫秒，預設 20 秒)
spring.datasource.hikari.connection-timeout=20000

# Hibernate 資料表結構自動更新策略 (update: 若資料表不存在或有新增欄位時自動更新，保留既有資料)
spring.jpa.hibernate.ddl-auto=update

# 控制是否在主控台印出 Hibernate 執行的 SQL 語句 (true: 開發時期顯示以便除錯)
spring.jpa.show-sql=true

# 關閉 Open-EntityManager-In-View 模式，遵循嚴謹 Service 事務邊界以避免連線佔用
spring.jpa.open-in-view=false

# 控制印出之 SQL 語句是否自動排版格式化
spring.jpa.properties.hibernate.format_sql=true

# 指定 Hibernate 使用之 MySQL 資料庫方言版本
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 啟動時自動執行 classpath:schema.sql 腳本以初始化資料庫結構 (always: 每次啟動皆檢查執行)
spring.sql.init.mode=always

# 指定初始化執行之 DDL 腳本檔案路徑
spring.sql.init.schema-locations=classpath:schema.sql

# JWT 簽發與驗證所使用之 HMAC-SHA256 對稱密鑰 (長度至少需 256 位元)
jwt.secret=SurveyFlowSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!

# JWT 短期 Access Token 之有效存活時限 (毫秒，900000 ms = 15 分鐘)
jwt.access-token-expiration-ms=900000

# JWT 長效 Refresh Token 之有效存活時限 (毫秒，604800000 ms = 7 天)
jwt.refresh-token-expiration-ms=604800000

# 控制 SurveyFlow 自訂套件日誌輸出層級為 DEBUG 以便本機除錯
logging.level.com.surveyflow=DEBUG

# 控制 Spring Security 安全認證框架日誌輸出層級
logging.level.org.springframework.security=INFO

# 控制 Hibernate SQL 日誌輸出層級
logging.level.org.hibernate.SQL=DEBUG

# ============================================================================
# 預設系統管理員與測試會員帳號密碼設定區塊 (可直接在此修改，重啟後自動同步至資料庫)
# ============================================================================

# 系統最高管理員登入帳號 (管理者登入用)
app.security.admin.username=admin

# 系統最高管理員登入密碼 (可隨時在此自由變更密碼)
app.security.admin.password=Admin123!

# 系統最高管理員電子信箱
app.security.admin.email=admin@surveyflow.com

# 系統最高管理員真實中文姓名 (Unicode: 系統最高管理員)
app.security.admin.fullname=\u7CFB\u7D71\u6700\u9AD8\u7BA1\u7406\u54E1

# 測試用一般會員登入帳號 (一般會員登入用)
app.security.test-user.username=testuser

# 測試用一般會員登入密碼 (可隨時在此自由變更密碼)
app.security.test-user.password=User1234!

# 測試用一般會員電子信箱
app.security.test-user.email=testuser@surveyflow.com

# 測試用一般會員真實中文姓名 (Unicode: 測試會員小明)
app.security.test-user.fullname=\u6E2C\u8A66\u6703\u54E1\u5C0F\u660E
