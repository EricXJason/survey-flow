# ==============================================================================
# 檔案名稱: application.properties
# 所屬模組: SurveyFlow 後端組態中心
# 責任描述: Spring Boot 核心系統屬性設定檔。採模組化區塊化架構，各區塊於頂部以條列式
#           完整說明所有組態參數之工程用途與業務邊界，杜絕程式碼與單行註解混雜。
# ==============================================================================

# ------------------------------------------------------------------------------
# 區塊 1: 網路伺服器與應用程式環境 (Server & Application Context)
# 參數條列說明:
#   - server.port: 嵌入式 Tomcat 監聽之 HTTP 通訊埠 (預設 8080)
#   - server.servlet.context-path: 全域 Web API 根路徑前綴 (預設 /)
#   - spring.application.name: Spring 應用程式識別名稱
# ------------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/
spring.application.name=survey-flow-backend

# ------------------------------------------------------------------------------
# 區塊 2: MySQL 8.x 資料庫連線與 HikariCP 連線池 (Database & HikariCP Pool)
# 參數條列說明:
#   - spring.datasource.url: JDBC 連線網址，鎖定 utf8mb4 編碼、臺北時區與公鑰檢索授權
#   - spring.datasource.username: 資料庫連線使用者帳號
#   - spring.datasource.password: 資料庫連線使用者密碼
#   - spring.datasource.driver-class-name: MySQL 8.x 官方 JDBC 驅動程式類別
#   - spring.datasource.hikari.maximum-pool-size: 連線池最大活躍連線數
#   - spring.datasource.hikari.minimum-idle: 連線池常駐最小閒置連線數
#   - spring.datasource.hikari.idle-timeout: 閒置連線釋放超時上限 (毫秒，預設 5 分鐘)
#   - spring.datasource.hikari.connection-timeout: 取得資料庫連線之等待超時上限 (毫秒，預設 20 秒)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/survey_flow?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# 區塊 3: JPA / Hibernate ORM 與 SQL 腳本初始化 (JPA & Schema Initialization)
# 參數條列說明:
#   - spring.jpa.hibernate.ddl-auto: DDL 自動同步模式 (update: 自動依 Entity 校驗補齊表結構)
#   - spring.jpa.show-sql: 是否於控制台輸出 Hibernate 產生的 SQL 語句
#   - spring.jpa.open-in-view: 關閉 Open-Session-in-View 模式，嚴格落實交易隔離與防止連線外洩
#   - spring.jpa.properties.hibernate.format_sql: 格式化日誌輸出之 SQL 語法提升可讀性
#   - spring.jpa.properties.hibernate.dialect: 指定 Hibernate 使用 MySQL 8 方言轉換器
#   - spring.sql.init.mode: 資料庫初始化模式 (always: 啟動時執行結構腳本)
#   - spring.sql.init.schema-locations: DDL 結構腳本路徑
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ------------------------------------------------------------------------------
# 區塊 4: JWT 安全驗證與權杖效期控管 (JWT Authentication & Token Lifetime)
# 參數條列說明:
#   - jwt.secret: HMAC-SHA256 對稱密碼雜湊密鑰 (長度需 >= 256 bits)
#   - jwt.access-token-expiration-ms: 短期 Access Token 存活毫秒數 (900,000 ms = 15 分鐘)
#   - jwt.refresh-token-expiration-ms: 長期 Refresh Token 存活毫秒數 (604,800,000 ms = 7 天)
# ------------------------------------------------------------------------------
jwt.secret=SurveyFlowSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ------------------------------------------------------------------------------
# 區塊 5: 全域日誌輸出層級配置 (Logging Level Configurations)
# 參數條列說明:
#   - logging.level.com.surveyflow: 專案業務核心程式碼之日誌級別 (DEBUG)
#   - logging.level.org.springframework.security: Spring Security 認證授權過濾器日誌級別 (INFO)
#   - logging.level.org.hibernate.SQL: Hibernate 底層執行 SQL 語句日誌級別 (DEBUG)
# ------------------------------------------------------------------------------
logging.level.com.surveyflow=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ------------------------------------------------------------------------------
# 區塊 6: 預設管理員與測試會員動態帳號憑證同步 (Pre-configured Credentials Sync)
# 參數條列說明:
#   - app.security.admin.username: 系統預設最高管理員登入帳號
#   - app.security.admin.password: 系統預設最高管理員明文密碼 (啟動時自動轉為 Argon2id 雜湊)
#   - app.security.admin.email: 系統預設最高管理員電子郵件
#   - app.security.test-user.username: 系統預設測試一般會員登入帳號
#   - app.security.test-user.password: 系統預設測試一般會員明文密碼 (啟動時自動轉為 Argon2id 雜湊)
#   - app.security.test-user.email: 系統預設測試一般會員電子郵件
# ------------------------------------------------------------------------------
app.security.admin.username=admin
app.security.admin.password=Admin123!
app.security.admin.email=admin@surveyflow.com

app.security.test-user.username=testuser
app.security.test-user.password=User1234!
app.security.test-user.email=testuser@surveyflow.com
