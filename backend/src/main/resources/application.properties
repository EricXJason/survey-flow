# ==============================================================================
# 檔案名稱: application.properties
# 所屬模組: SurveyFlow 後端組態中心
# 責任描述: Spring Boot 核心系統屬性設定，全面採用模組化大區塊集中註解規範
# ==============================================================================

# ------------------------------------------------------------------------------
# 區塊 1: 網路伺服器與應用程式基本環境 (Server & Application Context)
# 說明: 設定 HTTP 監聽通訊埠、URL 上下文根路徑與 Spring 服務名稱
# ------------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/
spring.application.name=survey-flow-backend

# ------------------------------------------------------------------------------
# 區塊 2: MySQL 8.x 資料庫連線與 HikariCP 高效連線池 (Database & HikariCP Pool)
# 說明: 連線至本機 3306 端口 survey_flow 資料庫，採用 UTF-8 編碼與臺北時區
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/survey_flow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# 區塊 3: JPA / Hibernate ORM 與 SQL DDL 初始化 (JPA & Schema DDL)
# 說明: 控制 ORM 自動維護、原生 SQL 印出格式與啟動自動校驗 schema 結構
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/01_schema.sql

# ------------------------------------------------------------------------------
# 區塊 4: JWT 安全驗證金鑰與 Token 存活週期 (JWT Authentication & Security)
# 說明: 包含 HMAC-SHA256 對稱密鑰、短期 Access Token (15 分鐘) 與長效 Refresh Token (7 天)
# ------------------------------------------------------------------------------
jwt.secret=SurveyFlowSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ------------------------------------------------------------------------------
# 區塊 5: 全域日誌輸出層級配置 (Logging Level Configurations)
# 說明: 針對業務層、安全認證層與持久化 SQL 執行語句設定偵錯級別
# ------------------------------------------------------------------------------
logging.level.com.surveyflow=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ------------------------------------------------------------------------------
# 區塊 6: 系統預設管理員與測試會員動態帳密同步 (Pre-configured Credentials Sync)
# 說明: 系統啟動時動態同步至 MySQL 資料庫 Argon2id 密碼雜湊，可隨時在此自由變更密碼
# ------------------------------------------------------------------------------
app.security.admin.username=admin
app.security.admin.password=Admin123!
app.security.admin.email=admin@surveyflow.com
app.security.admin.fullname=\u7CFB\u7D71\u6700\u9AD8\u7BA1\u7406\u54E1

app.security.test-user.username=testuser
app.security.test-user.password=User1234!
app.security.test-user.email=testuser@surveyflow.com
app.security.test-user.fullname=\u6E2C\u8A66\u6703\u54E1\u5C0F\u660E
