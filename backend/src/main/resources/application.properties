# ==============================================================================
# 檔案名稱: application.properties
# 所屬模組: SurveyFlow 後端組態中心
# 責任描述: Spring Boot 核心系統屬性設定檔。採模組化區塊化架構，各區塊於頂部以條列式
#           完整說明所有組態參數之工程用途與業務邊界，落實 OCP 原則與環境變數覆寫機制。
# ==============================================================================

# ------------------------------------------------------------------------------
# 區塊 1: 網路伺服器與應用程式環境 (Server & Application Context)
# 參數條列說明:
#   - server.port: 嵌入式 Tomcat 監聽之 HTTP 通訊埠 (預設 8080)
#   - server.servlet.context-path: 全域 Web API 根路徑前綴 (預設 /)
#   - spring.application.name: Spring 應用程式識別名稱
# ------------------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/
spring.application.name=survey-flow

# ------------------------------------------------------------------------------
# 區塊 1.1: 圖片與高容量載荷傳輸上限 (Payload & Multipart Capacity - 50MB)
# 參數條列說明:
#   - server.tomcat.max-http-form-post-size: Tomcat HTTP POST 請求體最大容量 (50MB)
#   - server.tomcat.max-swallow-size: Tomcat 請求吞吐超時上限 (50MB)
#   - spring.servlet.multipart.max-file-size: 單一檔案上傳上限 (50MB)
#   - spring.servlet.multipart.max-request-size: 單次請求整體上傳上限 (50MB)
#   - spring.jackson.parser.max-string-len: Jackson 解析長字串 (Base64 DataURL) 上限 (50MB)
# ------------------------------------------------------------------------------
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.jackson.parser.max-string-len=50000000

# ------------------------------------------------------------------------------
# 區塊 2: MySQL 8.x 資料庫連線與 HikariCP 連線池 (Database & HikariCP Pool)
# 參數條列說明:
#   - spring.datasource.url: JDBC 連線網址，鎖定 utf8mb4 編碼、臺北時區與公鑰檢索授權 (必填環境變數，無預設值)
#   - spring.datasource.username: 資料庫連線使用者帳號 (必填環境變數，無預設值)
#   - spring.datasource.password: 資料庫連線使用者密碼 (必填環境變數，無預設值)
#   ⚠️ 機敏連線資訊一律由環境變數注入 (本機參考 backend/.env.example)，缺少時應用啟動即失敗
#   - spring.datasource.driver-class-name: MySQL 8.x 官方 JDBC 驅動程式類別
#   - spring.datasource.hikari.maximum-pool-size: 連線池最大活躍連線數
#   - spring.datasource.hikari.minimum-idle: 連線池常駐最小閒置連線數
#   - spring.datasource.hikari.idle-timeout: 閒置連線釋放超時上限 (毫秒，預設 5 分鐘)
#   - spring.datasource.hikari.connection-timeout: 取得資料庫連線之等待超時上限 (毫秒，預設 20 秒)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}

# ------------------------------------------------------------------------------
# 區塊 3: JPA / Hibernate ORM 與 SQL 腳本初始化 (JPA & Schema Initialization)
# 參數條列說明:
#   - spring.jpa.hibernate.ddl-auto: DDL 自動同步模式 (none: 嚴格禁止 Hibernate 自動更動資料庫，結構 100% 由 schema.sql 主導)
#   - spring.jpa.show-sql: 是否以 System.out 輸出 SQL (關閉；需檢視 SQL 時改以 LOG_LEVEL_SQL=DEBUG 走結構化日誌)
#   - spring.jpa.open-in-view: 關閉 Open-Session-in-View 模式，嚴格落實交易隔離與防止連線外洩
#   - spring.jpa.properties.hibernate.format_sql: 格式化日誌輸出之 SQL 語法提升可讀性
#   - spring.jpa.properties.hibernate.dialect: 指定 Hibernate 使用 MySQL 8 方言轉換器
#   - spring.sql.init.mode: 資料庫初始化模式 (never: 避免覆寫真實持久化資料)
#   - spring.sql.init.schema-locations: DDL 結構腳本路徑
#   - spring.sql.init.data-locations: 示範種子資料，依編號順序執行 seed/01 ~ 05 (逗號分隔之順序即執行順序)
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/seed/01_reset_and_users.sql,classpath:database/seed/02_surveys_01_04.sql,classpath:database/seed/03_surveys_05_24.sql,classpath:database/seed/04_submissions_05_24.sql,classpath:database/seed/05_status_demo_25_27.sql

# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# 區塊 4: JWT 安全驗證與零信任雙權杖效期控管 (Zero-Trust Dual-Token Architecture)
# 參數條列說明:
#   - jwt.secret: HMAC-SHA256 對稱密碼雜湊密鑰 (長度需 >= 256 bits；必填環境變數 JWT_SECRET，無預設值)
#   - jwt.access-token-expiration-ms: 短效 Access Token 存活毫秒數 (預設 900,000 ms = 15 分鐘)
#   - jwt.refresh-token-expiration-ms: 長效 Refresh Token 存活毫秒數 (預設 604,800,000 ms = 7 天)
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Refresh Token Cookie 是否標記 Secure (正式環境須為 true；本機 HTTP 開發可設 REFRESH_COOKIE_SECURE=false)
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
# Refresh Token Cookie 之 SameSite (前後端跨站部署須為 None 且 Secure=true；本機 HTTP 開發設 REFRESH_COOKIE_SAME_SITE=Lax)
app.auth.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:None}

# ------------------------------------------------------------------------------
# 區塊 5: CORS 跨來源資源共用設定 (CORS Policy - OCP & SSOT)
# 核心架構說明:
#   - 貫徹 SSOT 單一真實來源：後端自動將 FRONTEND_BASE_URL 納入 CORS 允許來源名單，
#     因此在雲端 (Render) 僅需設定 FRONTEND_BASE_URL，CORS_ALLOWED_ORIGINS 可直接省略或留空！
#   - 若有跨多個獨立前端網域之進階需求，始得於 CORS_ALLOWED_ORIGINS 以逗號分隔追加。
# 參數條列說明:
#   - app.cors.allowed-origins: 額外允許之跨域來源列表 (選填，自動與 FRONTEND_BASE_URL 合併)
#   - app.cors.allowed-methods: 允許之 HTTP 方法
#   - app.cors.allowed-headers: 允許之 HTTP 請求標頭
#   - app.cors.max-age-seconds: 預檢請求 (Preflight) 快取秒數
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,Accept}
app.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

# ------------------------------------------------------------------------------
# 區塊 6: Argon2id 密碼雜湊安全參數 (Argon2id Hash Specs - OCP Externalized)
# 參數條列說明:
#   - app.security.argon2.salt-length: 隨機鹽值位元組長度 (16 bytes = 128 bits)
#   - app.security.argon2.hash-length: 輸出雜湊值位元組長度 (32 bytes = 256 bits)
#   - app.security.argon2.parallelism: 平行執行線程數 (1)
#   - app.security.argon2.memory: 記憶體開銷 (4096 KB = 4 MB)
#   - app.security.argon2.iterations: 迭代運算次數 (3)
# ------------------------------------------------------------------------------
app.security.argon2.salt-length=${ARGON2_SALT_LENGTH:16}
app.security.argon2.hash-length=${ARGON2_HASH_LENGTH:32}
app.security.argon2.parallelism=${ARGON2_PARALLELISM:1}
app.security.argon2.memory=${ARGON2_MEMORY:4096}
app.security.argon2.iterations=${ARGON2_ITERATIONS:3}
# 登入失敗鎖定：連續失敗達 max-failures 次即鎖定 lock-minutes 分鐘 (LoginAttemptLimiter)
app.security.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# ------------------------------------------------------------------------------
# 區塊 6.1: 全端點速率限制 (RateLimitFilter，依用戶端 IP 之固定時間窗計數)
# 超過上限回 429 Problem Details 與 Retry-After；計數存於單一實例記憶體，重啟歸零。
#   app.rate-limit.window-seconds            時間窗長度 (秒)；60 = 每分鐘重新計算。
#   app.rate-limit.auth-max-requests         /api/public/auth/** 每個時間窗上限 (20：正常登入註冊用不到，足以擋暴力破解與灌信)。
#   app.rate-limit.submission-max-requests   POST /api/public/submissions 上限 (60：同一出口 IP 的教室或辦公室一起填答也夠用)。
#   app.rate-limit.general-max-requests      其餘 API 上限 (300：一般操作每頁數個請求，遠低於此值)。
#   E2E 與整合測試由同一 IP 大量呼叫，於測試設定中調高。
# ------------------------------------------------------------------------------
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.auth-max-requests=${RATE_LIMIT_AUTH_MAX_REQUESTS:20}
app.rate-limit.submission-max-requests=${RATE_LIMIT_SUBMISSION_MAX_REQUESTS:60}
app.rate-limit.general-max-requests=${RATE_LIMIT_GENERAL_MAX_REQUESTS:300}

# ------------------------------------------------------------------------------
# 區塊 6.2: 用戶端 IP 解析 (ClientIpResolver)
# 速率限制、填答紀錄與稽核日誌都依此判斷來源 IP。
#   app.request.trusted-proxy-count   應用程式前方可信任反向代理層數：由 X-Forwarded-For 右邊數來第 N 筆為用戶端 IP。
#                                     Render 經一層代理為 1；本機直連設 0 (完全忽略 X-Forwarded-For，避免被偽造)。
#                                     部署後請比對結構化日誌之 clientIp 是否為真實來源，再調整此值。
# ------------------------------------------------------------------------------
app.request.trusted-proxy-count=${TRUSTED_PROXY_COUNT:1}

# ------------------------------------------------------------------------------
# 區塊 6.3: 稽核日誌完整性金鑰 (AuditHasher)
# 每筆稽核紀錄以 HMAC-SHA256 串成雜湊鏈，沒有金鑰的人即使能改資料庫也無法偽造。
#   app.audit.hmac-secret   HMAC 金鑰 (必填、無預設值，至少 32 bytes；缺少或過短時啟動失敗)。
#                           來源：環境變數 AUDIT_HMAC_SECRET。正式環境設定後不可更換，否則既有紀錄無法通過驗證。
# ------------------------------------------------------------------------------
app.audit.hmac-secret=${AUDIT_HMAC_SECRET}

# ------------------------------------------------------------------------------
# 區塊 7: 結構化 JSON 日誌與輸出層級 (Structured Logging)
# 每行一筆 JSON，必含 timestamp、level、traceId、service、message，日誌平臺可直接以欄位搜尋；
# traceId 與 clientIp 由 RequestTraceFilter 寫入 MDC，Spring Boot 自動帶出 MDC 欄位。
#   logging.structured.format.console           主控臺輸出格式：logstash (JSON)。
#   logging.structured.json.rename[@timestamp]  時間欄位改名為 timestamp。
#   logging.structured.json.add.service         每筆固定附上服務名稱 survey-flow-backend。
#   logging.structured.json.exclude             移除對排查無幫助之 @version、level_value 欄位。
#   logging.level.org.jasonproduction.surveyflow  專案程式碼日誌級別 (預設 INFO，可由 LOG_LEVEL_APP 覆寫)。
#   logging.level.org.springframework.security    Spring Security 日誌級別 (INFO)。
#   logging.level.org.hibernate.SQL               Hibernate SQL 日誌級別 (預設 INFO 不輸出 SQL，本機除錯可設 LOG_LEVEL_SQL=DEBUG)。
# ------------------------------------------------------------------------------
logging.structured.format.console=logstash
logging.structured.json.rename[@timestamp]=timestamp
logging.structured.json.add.service=survey-flow-backend
logging.structured.json.exclude=@version,level_value
logging.level.org.jasonproduction.surveyflow=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}


# ------------------------------------------------------------------------------
# 區塊 9: 郵件發送服務組態 (Mail Dispatch Configuration)
# 核心架構說明:
#   - 雲端生產環境 (Render) 全面以 Brevo HTTP REST API (走 HTTPS Port 443) 為主力發信管道，
#     不受免費雲端主機封鎖 SMTP 587/465 埠影響，可正常寄出 OTP 與驗證信。
#   - Gmail SMTP 僅作為本機離線開發或自架伺服器之降級備選方案。
# 參數條列說明:
#   - app.mail.brevo-api-key: Brevo API 金鑰 (雲端生產主力，走 HTTPS 443)
#   - app.mail.resend-api-key: Resend API 金鑰 (備用 HTTP 服務商)
#   - app.mail.provider: 指定郵件服務商 (AUTO / BREVO / RESEND / SMTP；AUTO 依序嘗試已設定金鑰之 Brevo -> Resend，最後 SMTP)；
#     所有管道皆失敗時回應 503，交易回滾 (不會留下收不到驗證碼的註冊資料)
#   - app.mail.from: 寄件人外顯信箱 (生產環境必須與 Brevo 授權寄件者一致)
#   - app.mail.sender-name: 寄件人外顯名稱
#   - app.frontend.base-url: 前端 SPA 根網址 (用於組裝驗證信中之直達連結)
# ------------------------------------------------------------------------------
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.provider=${MAIL_PROVIDER:AUTO}
app.mail.from=${MAIL_FROM:no-reply@surveyflow.tw}
app.mail.sender-name=SurveyFlow \u7dda\u4e0a\u554f\u5377\u5718\u968a
# 呼叫外部 HTTP API (Brevo / Resend) 之連線逾時秒數 (HttpClientConfig) 與單次請求逾時秒數 (MailService)
app.http.connect-timeout-seconds=${HTTP_CONNECT_TIMEOUT_SECONDS:10}
app.mail.request-timeout-seconds=${MAIL_REQUEST_TIMEOUT_SECONDS:15}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# ------------------------------------------------------------------------------
# 區塊 9.1: 本機開發 / 自架伺服器 SMTP 降級備用 (Local/Self-hosted SMTP Fallback)
# 參數條列說明:
#   - spring.mail.host: SMTP 主機 (預設 smtp.gmail.com)
#   - spring.mail.port: SMTP 通訊埠 (TLS 587)
#   - spring.mail.username: 寄信信箱帳號 (選填)
#   - spring.mail.password: 應用程式密碼 (選填)
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ------------------------------------------------------------------------------
# 區塊 10: Actuator 健康檢查與保活探針端點配置 (Actuator Health Probe)
# 參數條列說明:
#   - management.endpoints.web.exposure.include: 對外暴露之 Actuator 端點清單 (僅 health)
#   - management.endpoint.health.show-details: 健康檢查詳細資訊可見範圍 (never: 不對外洩漏元件狀態)
#   - management.health.db.enabled: 是否納入資料庫健康檢核 (關閉以避免 DB 暫時離線導致 /actuator/health 回傳 503)
#   - management.health.mail.enabled: 是否納入郵件伺服器健康檢核 (關閉以避免 SMTP 超時導致探針失敗)
# [Why]: Render 免費容器依賴 /actuator/health 回傳 200 判斷存活，若 DB/Mail 暫時不穩導致 503，
#        會觸發 Render 健康檢查失敗 → 重啟容器 → 無限循環冷啟動。故僅檢查 JVM 本身是否存活即可。
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.mail.enabled=false

