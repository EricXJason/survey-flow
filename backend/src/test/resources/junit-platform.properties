# ==============================================================================
# 檔案名稱: junit-platform.properties
# 責任描述: JUnit 5 平臺設定。
#   spring.test.constructor.autowire.mode=all  Spring 測試類別之建構子參數一律自動注入 Bean，
#                                              整合測試因此可用 private final 欄位 + 建構子，不需 @Autowired 欄位注入
# ==============================================================================
spring.test.constructor.autowire.mode=all
