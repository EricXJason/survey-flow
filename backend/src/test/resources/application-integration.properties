# ==============================================================================
# 檔案名稱: application-integration.properties
# 責任描述: 整合測試專用設定 (@ActiveProfiles("integration"))，覆寫正式設定中「必須由環境變數提供」之值。
#           資料庫連線由 IntegrationTestSupport 依 Testcontainers 動態注入，不在此檔。
# 使用時機: 只在 ./mvnw verify 執行 *IT.java 時載入，正式環境不會讀取。
# ==============================================================================

# ------------------------------------------------------------------------------
# 【1. JWT】測試專用金鑰 (僅存在於測試，與正式環境無關)
# ------------------------------------------------------------------------------
jwt.secret=integration-test-only-secret-key-at-least-32-bytes-long

# ------------------------------------------------------------------------------
# 【2. 資料庫初始化】每次啟動測試容器都執行 schema.sql (重建資料表) 與 seed/01~05 (種子資料，依編號順序)
#   spring.sql.init.mode          always：測試資料庫一律初始化 (正式環境為 never)
#   spring.jpa.defer-datasource-initialization  false：先跑 SQL 腳本再初始化 JPA
# ------------------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=false

# ------------------------------------------------------------------------------
# 【3. 郵件】只走 SMTP (JavaMailSender 在測試中為 Mock)，不呼叫 Brevo / Resend
# ------------------------------------------------------------------------------
app.mail.provider=SMTP
app.mail.brevo-api-key=
app.mail.resend-api-key=

# ------------------------------------------------------------------------------
# 【4. Refresh Cookie】MockMvc 不經過真實瀏覽器，Secure / SameSite 不影響測試，沿用正式預設值
# ------------------------------------------------------------------------------
app.auth.refresh-cookie-secure=true
app.auth.refresh-cookie-same-site=None

# ------------------------------------------------------------------------------
# 【5. CORS】整合測試以此來源驗證白名單行為
# ------------------------------------------------------------------------------
app.frontend.base-url=https://survey-flow.pages.dev
app.cors.allowed-origins=

# ------------------------------------------------------------------------------
# 【6. 速率限制、用戶端 IP、稽核金鑰】
#   app.rate-limit.*-max-requests   整合測試由同一 IP 大量呼叫，調高到不會觸發 (限流行為由 RateLimitFilterTest 驗證)。
#   app.request.trusted-proxy-count  MockMvc 請求沒有反向代理，設 0 直接使用連線來源。
#   app.audit.hmac-secret           稽核雜湊鏈測試專用金鑰 (僅存在於測試，與正式環境無關)。
# ------------------------------------------------------------------------------
app.rate-limit.auth-max-requests=100000
app.rate-limit.submission-max-requests=100000
app.rate-limit.general-max-requests=100000
app.request.trusted-proxy-count=0
app.audit.hmac-secret=integration-test-only-audit-hmac-secret-32bytes
